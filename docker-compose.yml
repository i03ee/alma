services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: alma
      POSTGRES_USER: alma
      POSTGRES_PASSWORD: alma_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alma -d alma"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alma
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alma:alma_dev_password@postgres:5432/alma
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    profiles:
      - app

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/main.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alma:alma_dev_password@postgres:5432/alma
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://object-storage:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    profiles:
      - app

volumes:
  postgres-data:
  minio-data:
