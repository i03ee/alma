openapi: 3.1.0
info:
  title: ALMA API
  version: 0.1.0
  description: Initial versioned API contract for ALMA. This contract documents intended endpoints; endpoint implementation is phased and must be verified by tests before being considered complete.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: API health response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
      responses:
        '202':
          description: OTP request accepted by the configured provider.
  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verified and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
  /me:
    get:
      operationId: getMe
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user profile.
  /orders:
    post:
      operationId: createOrder
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created.
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order details.
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancellation accepted if the state transition is valid.
  /drivers/availability:
    post:
      operationId: updateDriverAvailability
      tags: [Drivers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Driver availability updated.
  /driver/jobs:
    get:
      operationId: getDriverJobs
      tags: [Driver Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Jobs currently offered or assigned to the driver.
  /driver/jobs/{jobId}/accept:
    post:
      operationId: acceptDriverJob
      tags: [Driver Jobs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job accepted if still available.
  /driver/jobs/{jobId}/reject:
    post:
      operationId: rejectDriverJob
      tags: [Driver Jobs]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job rejection recorded.
  /orders/{orderId}/evidence:
    post:
      operationId: uploadPurchaseEvidence
      tags: [Purchase Evidence]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '201':
          description: Purchase evidence metadata recorded after object storage upload.
  /orders/{orderId}/approve-purchase:
    post:
      operationId: approvePurchase
      tags: [Purchase Evidence]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Purchase approved if required and transition is valid.
  /orders/{orderId}/tracking:
    get:
      operationId: getOrderTracking
      tags: [Tracking]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Latest tracking state for the order.
  /orders/{orderId}/delivery/verify:
    post:
      operationId: verifyDelivery
      tags: [Delivery]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Dynamic QR or OTP delivery verification accepted.
  /orders/{orderId}/rating:
    post:
      operationId: rateOrderParticipant
      tags: [Ratings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '201':
          description: Rating created if the actor is eligible.
  /orders/{orderId}/dispute:
    post:
      operationId: createDispute
      tags: [Disputes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '201':
          description: Dispute opened for operations review.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status:
          const: ok
        service:
          const: alma-api
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    RequestOtpRequest:
      type: object
      required: [name, phoneNumber]
      properties:
        name:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          description: Iraq phone number in normalized E.164 format when possible.
        preferredChannel:
          type: string
          enum: [whatsapp, sms]
    VerifyOtpRequest:
      type: object
      required: [phoneNumber, otp]
      properties:
        phoneNumber:
          type: string
        otp:
          type: string
          minLength: 4
          maxLength: 10
    AuthSession:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresInSeconds]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          const: Bearer
        expiresInSeconds:
          type: integer
